name: Bug 报告
description: 报告脚本或扩展在豆瓣页面上的异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请删除截图、日志中的账号名、Cookie、收藏列表等个人信息。
  - type: dropdown
    id: distribution
    attributes:
      label: 使用方式
      options:
        - Violentmonkey
        - Tampermonkey
        - Chrome 扩展
        - Edge 扩展
        - 其他
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本信息
      description: 请填写脚本/扩展版本、浏览器及浏览器版本
      placeholder: 例如：v1.8.0 / Chrome 142 / Windows 11
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 出现问题的页面
      placeholder: https://movie.douban.com/...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开…… 2. 点击…… 3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 控制台日志
      description: 请先移除 Cookie、token、账号名等敏感信息
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，且未发现相同问题
          required: true
        - label: 我已移除日志和截图中的敏感信息
          required: true
